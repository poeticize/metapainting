<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaPainting: Be a Part of the Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* RESET */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        
        /* STYLES */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a1a;
        }

        /* SPLASH CONTAINER */
        .splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* This loads your image and puts a dark tint over it so text pops */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('splash-bg.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            transition: opacity 1.5s ease-out;
            z-index: 10;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem; 
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        /* Make text bigger on desktop */
        @media (min-width: 768px) {
            h1 { font-size: 7rem; }
        }

        .enter-btn {
            background-color: #008080; /* TEAL */
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .enter-btn:hover {
            background-color: #FFA07A; /* CORAL */
            transform: scale(1.05);
        }

        /* MAIN SITE PLACEHOLDER (Hidden initially) */
        .main-site {
            display: none; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="splash-screen" id="splash">
        <h1>Be a Part of the Art</h1>
        <button class="enter-btn" onclick="enterSite()">Enter Gallery</button>
    </div>

    <div class="main-site" id="main">
        <h2 style="font-family: 'Bebas Neue'; font-size: 3rem;">Welcome to the MetaPainting Gallery of Wonders</h2>
        <p>The gallery is under construction...</p>
    </div>

    <script>
        function enterSite() {
            const splash = document.getElementById('splash');
            const main = document.getElementById('main');
            
            // Start Fade
            splash.style.opacity = '0';
            
            // Wait for fade (1.5s), then switch views
            setTimeout(() => {
                splash.style.display = 'none';
                main.style.display = 'flex'; 
            }, 1500);
        }
    </script>

</body>
</html>
