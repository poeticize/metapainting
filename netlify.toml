[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirects for old static URLs
[[redirects]]
  from = "/yogaman.html"
  to = "/paintings/yoga-man"
  status = 301

[[redirects]]
  from = "/yogaman"
  to = "/paintings/yoga-man"
  status = 301

[[redirects]]
  from = "/coded.html"
  to = "/paintings/coded"
  status = 301

[[redirects]]
  from = "/coded"
  to = "/paintings/coded"
  status = 301

[[redirects]]
  from = "/infinitree.html"
  to = "/paintings/infinitree"
  status = 301

[[redirects]]
  from = "/infinitree"
  to = "/paintings/infinitree"
  status = 301

[[redirects]]
  from = "/whirledreligion.html"
  to = "/paintings/whirled-religion"
  status = 301

[[redirects]]
  from = "/whirledreligion"
  to = "/paintings/whirled-religion"
  status = 301

[[redirects]]
  from = "/chemicalexpression.html"
  to = "/paintings/chemical-expression"
  status = 301

[[redirects]]
  from = "/chemicalexpression"
  to = "/paintings/chemical-expression"
  status = 301

[[redirects]]
  from = "/loveandburning"
  to = "/paintings/love-and-burning"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
